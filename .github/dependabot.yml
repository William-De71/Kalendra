version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels: ["dépendances", "ci"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
    labels: ["dépendances", "docker"]

  # Kalendra n'a pas de dépendance d'exécution ; seules les dépendances de
  # développement (ruff, caldav) sont déclarées dans pyproject.toml.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps"
    labels: ["dépendances"]
