name: Release

on:
  push:
    tags: ["v*.*.*"]
  # Appelable par « Préparer une version » : un push effectué avec le
  # GITHUB_TOKEN ne redéclenche aucun workflow (protection anti-boucle de
  # GitHub), donc l'étiquette seule ne suffirait pas à lancer la publication.
  workflow_call:
    inputs:
      tag:
        description: "Étiquette à publier (ex. v1.0.0 ou 1.0.0)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Étiquette à publier (ex. v1.0.0 ou 1.0.0)"
        required: true

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  # "1.4.0" typed by hand in the Run workflow form would otherwise be looked
  # up as a branch or tag named 1.4.0, and the checkout fails.
  TAG: ${{ !inputs.tag && github.ref_name || (startsWith(inputs.tag, 'v') && inputs.tag || format('v{0}', inputs.tag)) }}

jobs:
  verify:
    name: Vérification préalable
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      latest: ${{ steps.latest.outputs.latest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Déterminer la version
        id: version
        run: |
          ref="${TAG}"
          version="${ref#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Version publiée : ${version}"

      # Re-publishing an older tag by hand must not move "latest" back, and a
      # pre-release never gets it.
      - name: Est-ce la version la plus récente ?
        id: latest
        run: |
          tag="v${{ steps.version.outputs.version }}"
          newest=$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/##' \
            | grep -v -- - | sort -V | tail -n 1)
          if [ "$tag" = "$newest" ]; then latest=true; else latest=false; fi
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          echo "Plus récente : ${newest} — latest=${latest}"

      - name: La version du paquet doit correspondre à l'étiquette
        run: |
          declared=$(python scripts/bump-version.py --show)
          expected="${{ steps.version.outputs.version }}"
          if [ "$declared" != "$expected" ]; then
            echo "kalendra.__version__ = $declared mais l'étiquette annonce $expected"
            exit 1
          fi

      - name: Le journal des modifications doit mentionner la version
        run: grep -q "\[${{ steps.version.outputs.version }}\]" CHANGELOG.md

      - name: Suite de tests
        run: python -m unittest discover -s tests -t tests

  image:
    name: Publier l'image multi-architecture
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Authentification GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Étiquettes et métadonnées
        id: meta
        uses: docker/metadata-action@v6
        # The version is passed explicitly: without `value`, semver tags are
        # read from github.ref, which is refs/heads/main when "Préparer une
        # version" calls this workflow — only "latest" would be pushed.
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.verify.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.verify.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.verify.outputs.version }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.latest }}
          labels: |
            org.opencontainers.image.title=Kalendra
            org.opencontainers.image.description=Serveur CalDAV autonome sur SQLite avec flux ICS

      - name: Construire et pousser
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # GHCR refuses uppercase image names ("repository name must be
      # lowercase"), and this repository is William-De71/Kalendra.
      # docker/metadata-action lowercases on its own, but this attestation and
      # the pull command in the release notes do not.
      - name: Lowercase image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Attestation de provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  publish:
    name: Créer la release GitHub
    runs-on: ubuntu-latest
    needs: [verify, image]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Construire les artefacts Python
        run: |
          python -m pip install --upgrade build
          python -m build
          ls -l dist

      - name: Extraire les notes du journal des modifications
        id: notes
        env:
          IMAGE_REPO: ${{ github.repository }}
        run: |
          version="${{ needs.verify.outputs.version }}"
          IMAGE="${IMAGE_REPO,,}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          {
            echo ""
            echo "### Image Docker"
            echo ""
            echo '```sh'
            echo "docker pull ghcr.io/${IMAGE}:${version}"
            echo '```'
          } >> release-notes.md
          cat release-notes.md

      - name: Publier la release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: Kalendra ${{ needs.verify.outputs.version }}
          body_path: release-notes.md
          files: dist/*
          draft: false
          prerelease: ${{ contains(needs.verify.outputs.version, '-') }}
