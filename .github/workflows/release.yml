name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Étiquette à publier (ex. v1.0.0)"
        required: true

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    name: Vérification préalable
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Déterminer la version
        id: version
        run: |
          ref="${{ github.event.inputs.tag || github.ref_name }}"
          version="${ref#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Version publiée : ${version}"

      - name: La version du paquet doit correspondre à l'étiquette
        run: |
          declared=$(python -c "import re,pathlib; \
print(re.search(r'__version__ = \"([^\"]+)\"', \
pathlib.Path('src/kalendra/__init__.py').read_text()).group(1))")
          expected="${{ steps.version.outputs.version }}"
          if [ "$declared" != "$expected" ]; then
            echo "kalendra.__version__ = $declared mais l'étiquette annonce $expected"
            exit 1
          fi

      - name: Le journal des modifications doit mentionner la version
        run: grep -q "\[${{ steps.version.outputs.version }}\]" CHANGELOG.md

      - name: Suite de tests
        run: python -m unittest discover -s tests -t tests

  image:
    name: Publier l'image multi-architecture
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Authentification GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Étiquettes et métadonnées
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Kalendra
            org.opencontainers.image.description=Serveur CalDAV autonome sur SQLite avec flux ICS

      - name: Construire et pousser
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attestation de provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  publish:
    name: Créer la release GitHub
    runs-on: ubuntu-latest
    needs: [verify, image]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Construire les artefacts Python
        run: |
          python -m pip install --upgrade build
          python -m build
          ls -l dist

      - name: Extraire les notes du journal des modifications
        id: notes
        run: |
          version="${{ needs.verify.outputs.version }}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          {
            echo ""
            echo "### Image Docker"
            echo ""
            echo '```sh'
            echo "docker pull ghcr.io/${{ github.repository }}:${version}"
            echo '```'
          } >> release-notes.md
          cat release-notes.md

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Kalendra ${{ needs.verify.outputs.version }}
          body_path: release-notes.md
          files: dist/*
          draft: false
          prerelease: ${{ contains(needs.verify.outputs.version, '-') }}
