name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: kalendra
  ADMIN_USER: admin
  ADMIN_PASSWORD: motdepasse-de-test

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installer ruff
        run: pipx install ruff

      - name: ruff check
        run: ruff check src tests scripts

      - name: ruff format --check
        run: ruff format --check src tests scripts
        continue-on-error: true

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Kalendra n'a aucune dépendance d'exécution : la suite tourne telle quelle.
      - name: Suite de tests (stdlib)
        run: python -m unittest discover -s tests -t tests -v

      - name: Couverture
        if: matrix.python-version == '3.13'
        run: |
          python -m pip install --upgrade coverage
          python -m coverage run --source=src/kalendra -m unittest discover -s tests -t tests
          python -m coverage report --show-missing
          python -m coverage xml

      - name: Publier le rapport de couverture
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 14

  image:
    name: Image de test et validation bout en bout
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construire l'image de test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Démarrer le conteneur
        run: |
          docker run -d --name kalendra-ci \
            -p 5232:5232 \
            -e KALENDRA_ADMIN_USER="${ADMIN_USER}" \
            -e KALENDRA_ADMIN_PASSWORD="${ADMIN_PASSWORD}" \
            -e KALENDRA_PUBLIC_URL="http://127.0.0.1:5232" \
            "${IMAGE_NAME}:ci"

      - name: Attendre l'état « healthy »
        run: |
          for _ in $(seq 1 60); do
            state=$(docker inspect -f '{{.State.Health.Status}}' kalendra-ci 2>/dev/null || echo starting)
            [ "$state" = "healthy" ] && exit 0
            sleep 2
          done
          echo "Le conteneur n'est pas devenu sain"; docker logs kalendra-ci; exit 1

      - name: Vérification de mise en service
        run: |
          chmod +x scripts/verify-deployment.sh
          ./scripts/verify-deployment.sh http://127.0.0.1:5232 "${ADMIN_USER}" "${ADMIN_PASSWORD}"

      - name: Validation avec un client CalDAV réel
        run: |
          python -m pip install --upgrade "caldav>=3.3,<4"
          KALENDRA_TEST_URL=http://127.0.0.1:5232 \
          KALENDRA_TEST_USER="${ADMIN_USER}" \
          KALENDRA_TEST_PASSWORD="${ADMIN_PASSWORD}" \
          python -m unittest discover -s tests/integration -t . -v

      - name: Vérifier que le conteneur ne tourne pas en root
        run: |
          uid=$(docker exec kalendra-ci id -u)
          [ "$uid" != "0" ] || { echo "le conteneur tourne en root"; exit 1; }
          echo "uid=$uid"

      - name: Journaux du conteneur
        if: always()
        run: docker logs kalendra-ci || true

      - name: Arrêt
        if: always()
        run: docker rm -f kalendra-ci || true
