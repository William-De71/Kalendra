[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "kalendra"
version = "1.0.0"
description = "Serveur CalDAV local, autonome, sur SQLite, avec flux ICS public pour Google Calendar et Proton Calendar"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Will" }]
keywords = ["caldav", "calendar", "ics", "icalendar", "sqlite", "webdav", "self-hosted"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Scheduling",
]

#: Kalendra ne dépend que de la bibliothèque standard de Python.
dependencies = []

[project.optional-dependencies]
#: Serveur ASGI alternatif (facultatif) : `uvicorn kalendra.asgi:app --http h11`
asgi = ["uvicorn>=0.30"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "caldav>=1.3",
]

[project.urls]
Homepage = "https://github.com/OWNER/kalendra"
Repository = "https://github.com/OWNER/kalendra"
Issues = "https://github.com/OWNER/kalendra/issues"
Changelog = "https://github.com/OWNER/kalendra/blob/main/CHANGELOG.md"

[project.scripts]
kalendra = "kalendra.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kalendra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: tests requiring a live server (KALENDRA_TEST_URL)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["kalendra"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
